# CMH-MIL v3 实验配置 (方案C, 2026-11-19 全面对齐代码实际值)
# 论文: Bag-Level Contrastive Learning for Weakly-Supervised MIL Anomaly Detection
#       in Multivariate Time Series

# ===== 复现性 =====
seeds: [7, 42, 123, 202, 999]

# ===== 方案C双轨协议 =====
# 轨1 official: 官方train内70/15/15; test=官方test (protocol.official_split)
# 轨2 annot: 官方test前15%为弱标注块 (protocol.weak_annotation_split)
# TSB-AD 5集(无官方划分): 全流35/10/10/45 (four_block_split)
split:
  weak_train_ratio: 0.35
  val_ratio: 0.10
  calib_ratio: 0.10
  test_ratio: 0.45
  official_tt: 0.70
  official_tv: 0.15
  official_tc: 0.15
  weak_annot_frac: 0.15
  disjoint: true

# ===== Bag 协议 (n=8全覆盖) =====
bag:
  L: 128
  l: 16
  stride: 64              # bag_stride
  instance_stride: 16     # =l, 无缝覆盖, n=8

# ===== 模型 =====
model:
  encoder:
    type: tcn
    d_embed: 24
    channels: [32, 64]
    kernel_size: 3
    dropout: 0.1
  var_attention: false    # v3已删 (forward未调用)
  hyperspheres:
    k: 3
    init: kmeans          # k-means初始化 (run_v3.init_centers_kmeans)
    radius_mode: quantile # EMA(Q90)统计量, buffer无梯度
    radius_q: 0.9
    radius_ema: 0.9

# ===== v3 损失权重 =====
loss:
  bag_bce: 1.0
  contrast: 0.5           # w_contrast (InfoNCE/dispersion)
  topk: 1.0               # w_topk
  topk_margin: 1.0
  compact: 0.10
  sep: 0.05
  sep_margin: 1.5
  balance: 0.10
  contrast_tau: 0.1       # InfoNCE temperature

# ===== 阈值 (经验分位, 非共形保证) =====
threshold:
  method: empirical_quantile  # calib正常点Q95 (非conformal, 如实声明)
  alpha: 0.05

# ===== Pooling =====
pooling: max              # any-point语义 (v3统一)

# ===== 训练 =====
train:
  optimizer: adamw
  lr: 0.002
  weight_decay: 1.0e-5
  grad_clip: 5.0
  batch_size: 128
  max_epochs: 12
  device: cpu

# ===== 数据集 =====
datasets_official: [SMD, PSM, MSL, SMAP, WADI]     # 轨1 official_split
datasets_single_stream: [Exathlon-1, Exathlon-2, Genesis, Daphnet, CATSv2]  # TSB-AD
# SWaT已排除: 本地attack.csv全Attack(正例率100%), AUPRC退化

# ===== 评估 =====
eval:
  metrics: [AUPRC, PointF1, EventF1_one2one, AllEventMIoU, AUROC, FAR_point]
  event_match: maximum_cardinality  # scipy maximum_bipartite_matching
  stats: [Wilcoxon_paired]
